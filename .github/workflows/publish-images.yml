name: Build container images (validation only)

on:
  push:
    branches: ["main", "master"]
    paths:
      - "rathena/**"
      - "fluxcp/**"
      - "openkore/**"
      - "supervisor/**"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/manual-publish-images.yml"
      - ".github/workflows/database-integration.yml"
      - "docker-compose.yml"
      - ".env.example"
      - "README.md"
      - "unraid/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ragnarok-image-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ragnarok-rathena
            context: ./rathena
            dockerfile: ./rathena/Dockerfile
            build_args: |
              RATHENA_REF=d4b8e7b8f16061cc2496d377ac8f777ce72a4f39
              PACKETVER=20200401
          - name: ragnarok-fluxcp
            context: ./fluxcp
            dockerfile: ./fluxcp/Dockerfile
            build_args: FLUXCP_REF=98cd4b8fd83228c11b36fb3d097b8e0f7c105a8d
          - name: ragnarok-openkore
            context: ./openkore
            dockerfile: ./openkore/Dockerfile
            build_args: OPENKORE_REF=51de1ddfc4449ae5217f6886de702f87ca934030
          - name: ragnarok-ollama-supervisor
            context: ./supervisor
            dockerfile: ./supervisor/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          bash -n rathena/entrypoint.sh
          bash -n openkore/entrypoint.sh
          sh -n fluxcp/docker-entrypoint.sh

      - name: Validate Compose configuration and safety invariants
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose config --format json | jq -e '
            .services.fluxcp.depends_on.rathena.condition == "service_healthy"
            and ((.services.rathena.environment // {}) | has("PACKETVER") | not)
            and ((.services | has("mariadb")) | not)
          ' >/dev/null
          # Compose normalizes away inactive profile metadata in config output,
          # so assert opt-in profiles directly against the source Compose file.
          grep -Eq 'profiles:[[:space:]]*\["bot"\]' docker-compose.yml
          grep -Eq 'profiles:[[:space:]]*\["supervisor"\]' docker-compose.yml
          rm .env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
