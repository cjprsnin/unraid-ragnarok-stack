name: Build and publish container images

on:
  push:
    branches: ["main", "master"]
    paths:
      - "rathena/**"
      - "fluxcp/**"
      - "openkore/**"
      - "supervisor/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ragnarok-rathena
            context: ./rathena
            dockerfile: ./rathena/Dockerfile
            build_args: RATHENA_REF=master
          - name: ragnarok-fluxcp
            context: ./fluxcp
            dockerfile: ./fluxcp/Dockerfile
            build_args: FLUXCP_REF=master
          - name: ragnarok-openkore
            context: ./openkore
            dockerfile: ./openkore/Dockerfile
            build_args: OPENKORE_REF=master
          - name: ragnarok-ollama-supervisor
            context: ./supervisor
            dockerfile: ./supervisor/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: owner
        shell: bash
        run: echo "owner=$(echo '${GITHUB_REPOSITORY_OWNER}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
