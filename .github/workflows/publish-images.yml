name: Build container images (validation only)

on:
  push:
    branches: ["main", "master"]
    paths:
      - "rathena/**"
      - "fluxcp/**"
      - "openkore/**"
      - "supervisor/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ragnarok-image-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ragnarok-rathena
            context: ./rathena
            dockerfile: ./rathena/Dockerfile
            build_args: RATHENA_REF=master
          - name: ragnarok-fluxcp
            context: ./fluxcp
            dockerfile: ./fluxcp/Dockerfile
            build_args: FLUXCP_REF=master
          - name: ragnarok-openkore
            context: ./openkore
            dockerfile: ./openkore/Dockerfile
            build_args: OPENKORE_REF=master
          - name: ragnarok-ollama-supervisor
            context: ./supervisor
            dockerfile: ./supervisor/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          bash -n rathena/entrypoint.sh
          bash -n openkore/entrypoint.sh
          sh -n fluxcp/docker-entrypoint.sh

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q
          rm .env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
