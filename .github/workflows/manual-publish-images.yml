name: Publish container images (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Confirm publishing the validated images to GHCR"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ragnarok-image-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_publish == true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ragnarok-rathena
            context: ./rathena
            dockerfile: ./rathena/Dockerfile
            build_args: |
              RATHENA_REF=d4b8e7b8f16061cc2496d377ac8f777ce72a4f39
              PACKETVER=20200401
          - name: ragnarok-fluxcp
            context: ./fluxcp
            dockerfile: ./fluxcp/Dockerfile
            build_args: FLUXCP_REF=98cd4b8fd83228c11b36fb3d097b8e0f7c105a8d
          - name: ragnarok-openkore
            context: ./openkore
            dockerfile: ./openkore/Dockerfile
            build_args: OPENKORE_REF=51de1ddfc4449ae5217f6886de702f87ca934030
          - name: ragnarok-ollama-supervisor
            context: ./supervisor
            dockerfile: ./supervisor/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell script syntax
        run: |
          bash -n rathena/entrypoint.sh
          bash -n openkore/entrypoint.sh
          sh -n fluxcp/docker-entrypoint.sh

      - name: Validate Compose configuration and safety invariants
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose config --format json | jq -e '
            .services.fluxcp.depends_on.rathena.condition == "service_healthy"
            and ((.services.rathena.environment // {}) | has("PACKETVER") | not)
            and ((.services | has("mariadb")) | not)
          ' >/dev/null
          # Compose normalizes away inactive profile metadata in config output,
          # so assert opt-in profiles directly against the source Compose file.
          grep -Eq 'profiles:[[:space:]]*\["bot"\]' docker-compose.yml
          grep -Eq 'profiles:[[:space:]]*\["supervisor"\]' docker-compose.yml
          rm .env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/${{ matrix.name }}.tar

      - name: Upload validated image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-image
          path: /tmp/${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_publish == true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ragnarok-rathena
            context: ./rathena
            dockerfile: ./rathena/Dockerfile
            build_args: |
              RATHENA_REF=d4b8e7b8f16061cc2496d377ac8f777ce72a4f39
              PACKETVER=20200401
          - name: ragnarok-fluxcp
            context: ./fluxcp
            dockerfile: ./fluxcp/Dockerfile
            build_args: FLUXCP_REF=98cd4b8fd83228c11b36fb3d097b8e0f7c105a8d
          - name: ragnarok-openkore
            context: ./openkore
            dockerfile: ./openkore/Dockerfile
            build_args: OPENKORE_REF=51de1ddfc4449ae5217f6886de702f87ca934030
          - name: ragnarok-ollama-supervisor
            context: ./supervisor
            dockerfile: ./supervisor/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.name }}-image
          path: /tmp/validated-image

      - name: Load validated image
        run: docker load --input "/tmp/validated-image/${{ matrix.name }}.tar"

      - name: Tag validated image for latest
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
