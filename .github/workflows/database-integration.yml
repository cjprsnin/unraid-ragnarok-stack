name: Clean-stack integration test

on:
  pull_request:
    paths:
      - "rathena/**"
      - "fluxcp/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "database/**"
      - "tests/**"
      - ".github/workflows/database-integration.yml"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/manual-publish-images.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "rathena/**"
      - "fluxcp/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "database/**"
      - "tests/**"
      - ".github/workflows/database-integration.yml"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/manual-publish-images.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ragnarok-clean-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-stack-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n rathena/entrypoint.sh
          sh -n fluxcp/docker-entrypoint.sh
          bash -n tests/integration.sh

      - name: Build images and validate a clean Compose install
        run: bash tests/integration.sh
