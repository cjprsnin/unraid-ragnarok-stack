name: Compose configuration validation

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "database/**"
      - ".github/workflows/compose-validation.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "database/**"
      - ".github/workflows/compose-validation.yml"

permissions:
  contents: read

jobs:
  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database initializer syntax
        run: bash -n database/init/01-create-ragnarok-databases.sh

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q
